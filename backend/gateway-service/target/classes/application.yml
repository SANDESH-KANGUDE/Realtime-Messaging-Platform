server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - GatewayJwtFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**
          filters:
            - GatewayJwtFilter
        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/chats/**
          filters:
            - GatewayJwtFilter
        - id: message-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/messages/**
          filters:
            - GatewayJwtFilter
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - GatewayJwtFilter
        - id: media-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/media/**
          filters:
            - GatewayJwtFilter
        - id: search-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/search/**
          filters:
            - GatewayJwtFilter
        - id: admin-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - GatewayJwtFilter
        - id: payment-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - GatewayJwtFilter
        - id: realtime-service
          uri: ws://localhost:8085
          predicates:
            - Path=/socket.io/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

jwt:
  secret: defaultSecretKeyForDevelopmentPhaseThatIsMinimum256BitsLong!
