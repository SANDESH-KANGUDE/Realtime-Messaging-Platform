server:
  port: 8095 # Actuator/REST port

socketio:
  host: 0.0.0.0
  port: 8085 # Netty Socket.IO port

spring:
  application:
    name: realtime-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

jwt:
  secret: defaultSecretKeyForDevelopmentPhaseThatIsMinimum256BitsLong!
